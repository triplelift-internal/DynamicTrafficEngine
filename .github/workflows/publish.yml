name: publish

on:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Publish to GitHub Packages
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Upload with Gradle
        run: |
          cd java && ./gradlew --no-daemon -s :publishMavenPublicationToGitHubRepository -Pgpr.repo=${{ github.repository }} -Pgpr.user=${{ github.actor }} -Pgpr.password=${{ secrets.GITHUB_TOKEN }}
